<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cortex-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="100%" stop-color="#202025" />
    </linearGradient>
    <linearGradient id="cortex-accent" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#cortex-bg)"/>
  <rect width="800" height="500" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="360" cy="250" r="300" fill="url(#cortex-accent)"/>

  <g transform="translate(60, 60)">
    <!-- Header -->
    <rect x="0" y="0" width="680" height="48" rx="8" fill="#1b1b1e" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.6"/>
    <circle cx="48" cy="24" r="6" fill="#eab308" opacity="0.6"/>
    <circle cx="68" cy="24" r="6" fill="#22c55e" opacity="0.6"/>
    <text x="96" y="29" fill="#a1a1aa" font-family="monospace" font-size="12">cortex-lens // correlaciones-en-vivo</text>

    <!-- Visual Distribution Chart & Sparklines -->
    <rect x="0" y="70" width="440" height="280" rx="12" fill="#161619" stroke="rgba(255,255,255,0.06)"/>
    <text x="24" y="105" fill="#a855f7" font-family="monospace" font-size="11">MATRIZ DE DENSIDAD OPERATIVA</text>

    <!-- Grid lines -->
    <line x1="24" y1="140" x2="416" y2="140" stroke="rgba(255,255,255,0.04)"/>
    <line x1="24" y1="190" x2="416" y2="190" stroke="rgba(255,255,255,0.04)"/>
    <line x1="24" y1="240" x2="416" y2="240" stroke="rgba(255,255,255,0.04)"/>
    <line x1="24" y1="290" x2="416" y2="290" stroke="rgba(255,255,255,0.04)"/>

    <!-- Wave curve -->
    <path d="M 24 250 Q 80 160 140 210 T 260 150 T 360 210 T 416 130" stroke="#a855f7" stroke-width="2.5" fill="none"/>
    <path d="M 24 280 Q 90 220 150 250 T 270 200 T 370 240 T 416 180" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" fill="none"/>

    <!-- Scatter points -->
    <circle cx="140" cy="210" r="5" fill="#a855f7"/>
    <circle cx="260" cy="150" r="6" fill="#f43f5e"/>
    <circle cx="360" cy="210" r="4" fill="#a855f7"/>
    <circle cx="416" cy="130" r="5" fill="#22c55e"/>

    <text x="24" y="325" fill="#a1a1aa" font-family="monospace" font-size="11">Detección de anomalías en latencia: 0 falsos positivos</text>

    <!-- Side Inspection Panel -->
    <rect x="460" y="70" width="220" height="280" rx="12" fill="#161619" stroke="rgba(255,255,255,0.06)"/>
    <text x="480" y="105" fill="#71717a" font-family="monospace" font-size="11">FILTRO PREDICTIVO</text>
    <text x="480" y="132" fill="#fafafa" font-family="sans-serif" font-size="14" font-weight="600">Eventos Activos</text>

    <rect x="480" y="150" width="180" height="48" rx="6" fill="#222228"/>
    <text x="492" y="172" fill="#e4e4e7" font-family="monospace" font-size="11">CPU Cluster Alpha</text>
    <text x="492" y="188" fill="#22c55e" font-family="monospace" font-size="10">Estable (28% cap)</text>

    <rect x="480" y="210" width="180" height="48" rx="6" fill="#222228"/>
    <text x="492" y="232" fill="#e4e4e7" font-family="monospace" font-size="11">Cache Hit Rate</text>
    <text x="492" y="248" fill="#38bdf8" font-family="monospace" font-size="10">99.4% promedio</text>

    <rect x="480" y="270" width="180" height="48" rx="6" fill="#222228"/>
    <text x="492" y="292" fill="#e4e4e7" font-family="monospace" font-size="11">Throughput</text>
    <text x="492" y="308" fill="#a855f7" font-family="monospace" font-size="10">8.2k req/s</text>
  </g>
</svg>
