<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="med-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#med-bg)"/>
  <rect width="800" height="500" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="240" cy="200" r="260" fill="url(#glow)"/>

  <!-- Clinical Decision Flow Diagram -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="680" height="48" rx="8" fill="#222226" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.6"/>
    <circle cx="48" cy="24" r="6" fill="#eab308" opacity="0.6"/>
    <circle cx="68" cy="24" r="6" fill="#22c55e" opacity="0.6"/>
    <text x="96" y="29" fill="#a1a1aa" font-family="monospace" font-size="12">medmind // simulacion-clinica-v2.8</text>

    <!-- Medical Diagnostic Cards -->
    <rect x="0" y="70" width="320" height="280" rx="12" fill="#1c1c1f" stroke="rgba(255,255,255,0.06)"/>
    <text x="24" y="105" fill="#f43f5e" font-family="monospace" font-size="11">PROTOCOLO DE URGENCIA</text>
    <text x="24" y="132" fill="#fafafa" font-family="serif" font-size="18" font-weight="500">Evaluación Sintomática Inicial</text>
    <line x1="24" y1="150" x2="296" y2="150" stroke="rgba(255,255,255,0.08)"/>

    <!-- Pulse ECG Graphic -->
    <path d="M 24 210 L 80 210 L 95 180 L 110 240 L 125 195 L 140 215 L 150 210 L 296 210" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="125" cy="195" r="4" fill="#38bdf8"/>
    <text x="24" y="270" fill="#a1a1aa" font-family="sans-serif" font-size="12">Precisión de diagnóstico: 94.8%</text>
    <text x="24" y="292" fill="#71717a" font-family="sans-serif" font-size="11">Tiempo promedio de decisión: 48s</text>

    <!-- Side Feedback Tree -->
    <rect x="340" y="70" width="340" height="280" rx="12" fill="#1c1c1f" stroke="rgba(255,255,255,0.06)"/>
    <text x="364" y="105" fill="#38bdf8" font-family="monospace" font-size="11">FEEDBACK FORMATIVO</text>
    <text x="364" y="132" fill="#fafafa" font-family="serif" font-size="18" font-weight="500">Árbol de Decisión Asistida</text>
    <line x1="364" y1="150" x2="656" y2="150" stroke="rgba(255,255,255,0.08)"/>

    <rect x="364" y="170" width="292" height="36" rx="6" fill="#27272a"/>
    <text x="380" y="193" fill="#e4e4e7" font-family="monospace" font-size="12">Paso 1: Triage con saturación < 92%</text>

    <rect x="364" y="216" width="292" height="36" rx="6" fill="#27272a"/>
    <text x="380" y="239" fill="#e4e4e7" font-family="monospace" font-size="12">Paso 2: Administración oxigenación</text>

    <rect x="364" y="262" width="292" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="380" y="285" fill="#38bdf8" font-family="monospace" font-size="12">Paso 3: Re-evaluación en 15 min</text>
  </g>
</svg>
