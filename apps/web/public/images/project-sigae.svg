<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sigae-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#1c1c1f" />
    </linearGradient>
    <linearGradient id="sigae-accent" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97746" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d97746" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#sigae-bg)"/>
  <rect width="800" height="500" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="560" cy="220" r="280" fill="url(#sigae-accent)"/>

  <g transform="translate(60, 60)">
    <!-- Browser Window Frame -->
    <rect x="0" y="0" width="680" height="48" rx="8" fill="#1e1e24" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.6"/>
    <circle cx="48" cy="24" r="6" fill="#eab308" opacity="0.6"/>
    <circle cx="68" cy="24" r="6" fill="#22c55e" opacity="0.6"/>
    <text x="96" y="29" fill="#a1a1aa" font-family="monospace" font-size="12">sigae.unap.edu.pe // admision-v4-optimizado</text>

    <!-- Admission Funnel Progress Flow -->
    <rect x="0" y="70" width="680" height="120" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.06)"/>
    <text x="28" y="102" fill="#d97746" font-family="monospace" font-size="11">FLUJO LINEAL SIMPLIFICADO (-64% FRICCIÓN)</text>

    <!-- Step indicators -->
    <g transform="translate(28, 120)">
      <circle cx="20" cy="20" r="16" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
      <text x="16" y="25" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="bold">✓</text>
      <text x="48" y="24" fill="#fafafa" font-family="sans-serif" font-size="13">Identidad</text>

      <line x1="120" y1="20" x2="190" y2="20" stroke="#22c55e" stroke-width="2"/>

      <circle cx="210" cy="20" r="16" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
      <text x="206" y="25" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="bold">✓</text>
      <text x="238" y="24" fill="#fafafa" font-family="sans-serif" font-size="13">Expediente</text>

      <line x1="330" y1="20" x2="400" y2="20" stroke="#d97746" stroke-width="2"/>

      <circle cx="420" cy="20" r="16" fill="#d97746" fill-opacity="0.2" stroke="#d97746" stroke-width="2"/>
      <circle cx="420" cy="20" r="6" fill="#d97746"/>
      <text x="448" y="24" fill="#d97746" font-family="sans-serif" font-size="13" font-weight="bold">Validación Activa</text>

      <line x1="570" y1="20" x2="610" y2="20" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4"/>
    </g>

    <!-- Metrics comparisons -->
    <rect x="0" y="210" width="320" height="140" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.06)"/>
    <text x="24" y="245" fill="#71717a" font-family="monospace" font-size="11">TIEMPO TOTAL DE TRÁMITE</text>
    <text x="24" y="285" fill="#fafafa" font-family="serif" font-size="28" font-weight="500">4.2 min</text>
    <text x="140" y="285" fill="#22c55e" font-family="monospace" font-size="14">↓ 72% menos</text>
    <text x="24" y="320" fill="#a1a1aa" font-family="sans-serif" font-size="12">Antes requería ~15 minutos y múltiples recargas.</text>

    <rect x="340" y="210" width="340" height="140" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.06)"/>
    <text x="364" y="245" fill="#71717a" font-family="monospace" font-size="11">TASA DE COMPLETITUD</text>
    <text x="364" y="285" fill="#fafafa" font-family="serif" font-size="28" font-weight="500">99.1%</text>
    <text x="480" y="285" fill="#22c55e" font-family="monospace" font-size="14">↑ Cero caídas</text>
    <text x="364" y="320" fill="#a1a1aa" font-family="sans-serif" font-size="12">Más de 24,000 postulantes procesados en simultáneo.</text>
  </g>
</svg>
